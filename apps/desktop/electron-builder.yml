appId: com.skillink.app
productName: Skillink
directories:
  output: release
electronDist: node_modules/electron/dist
files:
  - out/**/*
  - package.json
extraResources:
  - from: ../cli/dist/index.js
    to: cli/skillink.mjs
  - from: build/cli/skillink.cmd
    to: cli/skillink.cmd
  - from: build/cli/skillink-path.ps1
    to: cli/skillink-path.ps1
  - from: ../../locales/zh-CN.json
    to: locales/zh-CN.json
asar: true
win:
  icon: build/icon.ico
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: build/installer.nsh
